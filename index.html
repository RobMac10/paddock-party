<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Declan &amp; Kate's 18th — Paddock Party</title>
  <style>
@font-face {
  font-family: 'Fraunces';
  font-style: italic;
  font-weight: 500;
  font-display: swap;
  src: url('fonts/fraunces-italic-500-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Fraunces';
  font-style: normal;
  font-weight: 500 700;
  font-display: swap;
  src: url('fonts/fraunces-normal-500-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Source Sans 3';
  font-style: italic;
  font-weight: 400;
  font-display: swap;
  src: url('fonts/sourcesans3-italic-400-latin.woff2') format('woff2');
}

@font-face {
  font-family: 'Source Sans 3';
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url('fonts/sourcesans3-normal-400-latin.woff2') format('woff2');
}

:root {
  --sky: #152238;
  --sky-2: #1c2e4a;
  --navy: #0e1726;
  --gold: #d4a44a;
  --gold-soft: #e8c87a;
  --hay: #f3ead4;
  --cream: #f7f1e4;
  --paper: #fffaf1;
  --ink: #2a2118;
  --muted: #5c4a32;
  --rule: #d9c9a4;
  --shadow: 0 10px 28px rgba(21, 34, 56, 0.14);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Source Sans 3", "Segoe UI", "Helvetica Neue", sans-serif;
  color: var(--ink);
  background: radial-gradient(1200px 500px at 50% -80px, #efe3c4 0%, var(--cream) 55%);
  line-height: 1.5;
  min-height: 100vh;
}
img, video { max-width: 100%; height: auto; }
a { color: inherit; }

.site-header {
  background:
    radial-gradient(circle at 88% 18%, rgba(255,255,230,0.14), transparent 28%),
    linear-gradient(180deg, var(--navy) 0%, var(--sky) 60%, var(--sky-2) 100%);
  color: var(--cream);
  text-align: center;
  padding: 1.4rem 1.25rem 3.25rem;
  position: relative;
  overflow: hidden;
}
.site-header::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 42px;
  background: var(--cream);
  clip-path: ellipse(70% 100% at 50% 100%);
}
.moon {
  position: absolute;
  top: 1.6rem;
  right: 8%;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff9df, #e8d9a0 70%);
  box-shadow: 0 0 28px 8px rgba(232, 216, 150, 0.22);
  opacity: 0.7;
  pointer-events: none;
}
.festoon {
  position: relative;
  height: 54px;
  max-width: 44rem;
  margin: 0 auto 1.15rem;
}
.festoon::before {
  content: "";
  position: absolute;
  left: 3%;
  right: 3%;
  top: 10px;
  height: 2px;
  background: linear-gradient(90deg, transparent, #c4a35acc, #e8c87a, #c4a35acc, transparent);
}
.festoon i {
  position: absolute;
  top: 10px;
  width: 11px;
  height: 16px;
  border-radius: 50% 50% 40% 40%;
  background: radial-gradient(circle at 35% 30%, #fff8d8, #f0c14b 58%, #c48420);
  box-shadow: 0 4px 14px 3px rgba(240, 193, 75, 0.45);
  transform: translateX(-50%);
  pointer-events: none;
}
.festoon i:nth-child(odd) { top: 16px; }
.festoon i:nth-child(3n) { top: 8px; }

.brand-kicker {
  font-family: "Source Sans 3", "Segoe UI", sans-serif;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  font-size: 0.72rem;
  color: var(--gold-soft);
  margin: 0 0 0.55rem;
}
.brand-title {
  font-family: Fraunces, Georgia, "Palatino Linotype", Palatino, "Times New Roman", serif;
  font-weight: 500;
  font-size: clamp(2.15rem, 7.2vw, 4.35rem);
  line-height: 1.02;
  letter-spacing: -0.02em;
  margin: 0;
  color: #f8f1e2;
  font-synthesis: none;
}
.brand-title em {
  display: block;
  font-style: italic;
  font-weight: 500;
  color: var(--gold-soft);
  font-size: 0.72em;
  letter-spacing: 0;
  margin-top: 0.06em;
}
.brand-sub {
  font-family: Fraunces, Georgia, Palatino, serif;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(1.35rem, 3.6vw, 2.05rem);
  color: var(--gold);
  margin: 0.7rem 0 0;
}
.lede {
  font-size: 1.05rem;
  max-width: 28rem;
  margin: 1.15rem auto 0;
  color: #e6d8b4;
  font-weight: 400;
}
.date-line {
  margin: 0.55rem 0 0;
  color: var(--gold-soft);
  letter-spacing: 0.08em;
  font-size: 0.92rem;
}

main {
  width: min(1080px, calc(100% - 2rem));
  margin: 0 auto 4rem;
  padding-top: 0.5rem;
}
.section {
  margin: 2.75rem 0 3.25rem;
}
.section-head {
  text-align: center;
  margin: 0 0 1.4rem;
}
.section-head h2 {
  font-family: Fraunces, Georgia, Palatino, serif;
  font-weight: 500;
  font-style: italic;
  font-size: clamp(1.55rem, 3vw, 2.05rem);
  margin: 0;
  color: var(--sky);
}
.section-head h2::before,
.section-head h2::after {
  content: "✦";
  font-style: normal;
  font-size: 0.45em;
  color: var(--gold);
  vertical-align: middle;
  margin: 0 0.7em;
  letter-spacing: 0;
}

.gallery {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.35rem 1.2rem;
}
@media (min-width: 720px) {
  .gallery { grid-template-columns: 1fr 1fr; }
  .card.wide { grid-column: 1 / -1; }
}
.card {
  margin: 0;
  background: transparent;
}
.card button.shot {
  display: block;
  width: 100%;
  padding: 0;
  border: 0;
  background: var(--paper);
  cursor: zoom-in;
  border-radius: 6px;
  box-shadow: var(--shadow);
  padding: 0.55rem;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.card button.shot:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 32px rgba(21, 34, 56, 0.18);
}
.card button.shot:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}
.card img,
.card video {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
  background: var(--paper);
  border-radius: 2px;
}
@media (min-width: 720px) {
  .card:not(.wide) img {
    max-height: 82vh;
  }
}
.video-card .video-wrap {
  background: var(--paper);
  border-radius: 6px;
  box-shadow: var(--shadow);
  padding: 0.55rem;
}
.video-card video {
  background: var(--navy);
  width: 100%;
  max-height: 82vh;
}
.video-placeholder {
  position: relative;
  display: block;
  margin: 0;
}
.video-placeholder img {
  width: 100%;
  height: auto;
  max-height: 82vh;
  object-fit: contain;
  display: block;
  background: var(--navy);
  border-radius: 2px;
}
.play-badge {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: rgba(15, 23, 38, 0.62);
  border: 2px solid var(--gold-soft);
  pointer-events: none;
}
.play-badge::after {
  content: "";
  position: absolute;
  left: 27px;
  top: 22px;
  border-style: solid;
  border-width: 13px 0 13px 22px;
  border-color: transparent transparent transparent var(--gold-soft);
}

.site-footer {
  text-align: center;
  padding: 1rem 1.25rem 3rem;
  color: var(--muted);
  font-family: Fraunces, Georgia, Palatino, serif;
  font-style: italic;
  font-size: 1rem;
}
.site-footer .rule {
  width: 4.5rem;
  height: 1px;
  background: var(--rule);
  margin: 0 auto 1rem;
}

/* Lightbox */
.lb {
  position: fixed;
  inset: 0;
  background: #0c121c;
  display: none;
  z-index: 9999;
  color: var(--cream);
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 0;
}
.lb.open { display: flex; }
.lb img {
  max-width: min(100vw - 2rem, 1400px);
  max-height: calc(100vh - 2.5rem);
  object-fit: contain;
  box-shadow: 0 10px 40px rgba(0,0,0,0.45);
}
.lb-btn {
  position: absolute;
  appearance: none;
  border: 0;
  background: rgba(255,255,255,0.08);
  color: var(--cream);
  width: 48px;
  height: 48px;
  border-radius: 50%;
  font-size: 1.6rem;
  line-height: 1;
  cursor: pointer;
  display: grid;
  place-items: center;
}
.lb-btn:hover, .lb-btn:focus-visible {
  background: rgba(212, 164, 74, 0.3);
  outline: 2px solid var(--gold);
}
.lb-close { top: 0.7rem; right: 0.7rem; font-size: 1.8rem; }
.lb-prev { left: 0.6rem; top: 50%; transform: translateY(-50%); }
.lb-next { right: 0.6rem; top: 50%; transform: translateY(-50%); }
body.lb-lock { overflow: hidden; }

@media (max-width: 719px) {
  .site-header { padding-bottom: 2.6rem; }
  .lb-prev, .lb-next { top: auto; bottom: 0.7rem; transform: none; }
  .lb img { max-height: calc(100vh - 5.5rem); }
  .card button.shot { padding: 0.4rem; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .card button.shot { transition: none; }
}
  </style>
</head>

  <div class="lb" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photograph">
    <button class="lb-btn lb-close" type="button" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" type="button" aria-label="Previous photograph">&#8249;</button>
    <img id="lb-image" alt="">
    <button class="lb-btn lb-next" type="button" aria-label="Next photograph">&#8250;</button>
  </div>

  <script>
  (function () {
    const box = document.getElementById("lightbox");
    const img = document.getElementById("lb-image");
    const buttons = Array.from(document.querySelectorAll("[data-slide]"));
    const SLIDES = buttons.map(function (btn) {
      const pic = btn.querySelector("img");
      return { src: pic.getAttribute("src"), alt: pic.getAttribute("alt") || "" };
    });
    let i = 0;
    let startX = null;

    function show(n) {
      if (!SLIDES.length) return;
      i = (n + SLIDES.length) % SLIDES.length;
      const s = SLIDES[i];
      img.src = s.src;
      img.alt = s.alt || "";
    }
    function openAt(n) {
      show(n);
      box.hidden = false;
      box.classList.add("open");
      document.body.classList.add("lb-lock");
      box.querySelector(".lb-close").focus();
    }
    function close() {
      box.classList.remove("open");
      box.hidden = true;
      document.body.classList.remove("lb-lock");
    }

    document.querySelectorAll("[data-slide]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        openAt(parseInt(btn.getAttribute("data-slide"), 10));
      });
    });
    box.querySelector(".lb-close").addEventListener("click", close);
    box.querySelector(".lb-prev").addEventListener("click", function () { show(i - 1); });
    box.querySelector(".lb-next").addEventListener("click", function () { show(i + 1); });
    box.addEventListener("click", function (e) {
      if (e.target === box) close();
    });
    document.addEventListener("keydown", function (e) {
      if (!box.classList.contains("open")) return;
      if (e.key === "Escape") close();
      if (e.key === "ArrowLeft") show(i - 1);
      if (e.key === "ArrowRight") show(i + 1);
    });
    box.addEventListener("touchstart", function (e) {
      if (e.changedTouches[0]) startX = e.changedTouches[0].clientX;
    }, { passive: true });
    box.addEventListener("touchend", function (e) {
      if (startX == null || !e.changedTouches[0]) return;
      const dx = e.changedTouches[0].clientX - startX;
      startX = null;
      if (dx > 50) show(i - 1);
      if (dx < -50) show(i + 1);
    }, { passive: true });
  })();
  </script>
